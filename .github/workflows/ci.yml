name: CI

on:
  # A pull request is checked as its own event, so a push to its branch would only run CI twice.
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only a pull request's superseded run is cancelled, so every commit on master keeps a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The workspaces import the libs through their build output.
      - run: npm run build:libs

      - run: npm run code:format:check

      - run: npm run code:lint

      - run: npm run code:typecheck

  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      # Dev dependencies included, and any severity fails.
      - run: npm audit

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build:libs

      - run: npm test

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build:libs

      # Each pass migrates its own temporary SQLite file, so the job needs no database service.
      - run: npm run test:integration
